<!DOCTYPE html>

                    </div>
                    <div class="downloads">
                        <button onclick="window.open('https://ghinorhino.itch.io/deltamod')">
                            <span class="material-symbols-outlined">download</span>

                </div>
            </div>
            <div class="projectCard" style="background-image: url('./assets/remoteruneBG.png')">
                <div class="content">
                    <div class="txt">
                        <img src="assets/remoterune.png" alt="" width="80" height="80">
                        <h2>REMOTERune</h2>
                        <span>DELTARUNE reimagined as a multiplayer game.</span>
                        <small class="authors">Owned by mc-intosh</small>
                    </div>
                    <div class="downloads">
                        <button class="disabled" disabled>
                            <span class="material-symbols-outlined">download</span>
                            <div style="text-align: left;">
                                <i>Not yet released</i>
                            </div>
                        </button>
                        <button onclick="window.open('https://remoterune.net')">
                            <span class="material-symbols-outlined">open_in_new</span>
                            Website
                        </button>
                        <button onclick="window.open('https://gamebanana.com/wips/94758')">
                            <span class="material-symbols-outlined">open_in_new</span>
                            GameBanana
                        </button>
                    </div>
                </div>
            </div>
            <div class="projectCard" style="background-image: url('./assets/discordBG.png')">
                <div class="content">
                    <div class="txt">
                        <img src="assets/discord.svg" alt="" width="80" height="80">
                        <h2>Community</h2>
                        <span>Join our modding community on Discord!</span>
                        <small class="authors">Owned by mc-intosh</small>
                    </div>
                    <div class="downloads">
                        <button id="discordButton">
                            <span class="material-symbols-outlined">open_in_new</span>
                            <div id="discordButtonText">
                                Join us!
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="projectCard" style="background-image: url('./assets/gm3pBG.png')">
                <div class="content">
                    <div class="txt">
                        <img src="assets/gm3p.svg" alt="" width="80" height="80">
                        <h2>GM3P</h2>
                        <span>A mod merger for GameMaker games.</span>
                        <small class="authors">Owned by techy804</small>
                    </div>
                    <div class="downloads">
                        <button onclick="window.open('https://gamebanana.com/tools/20063')">
                            <span class="material-symbols-outlined">download</span>
                            <div style="text-align: left;">
                                GameBanana
                            </div>
                        </button>
                        <button onclick="window.open('https://www.github.com/deltamodders/GM3P')">
                            <span class="material-symbols-outlined">download</span>
                            <div style="text-align: left;">
                                GitHub
                            </div>
                        </button>
                    </div>
                </div>
            </div>

    </div>
</body>

<script>
    async function loadDiscordData(el) {
        try {
            const response = await fetch('https://discord.com/api/guilds/1390331292993982484/widget.json');
            const data = await response.json();
            el.innerHTML = `Join us!<br><small>${data.presence_count} online</small>`;
            document.getElementById('discordButton').onclick = () => {
                window.open('https://deltamodders.com/discord', '_blank');
            };
        } catch (e) {
            console.error('Failed to load Discord data:', e);
        }
    }
    loadDiscordData(document.getElementById('discordButtonText'));
    var i = -1;
    document.querySelectorAll('.projectCard').forEach(card => {
        i++;
        card.style.opacity = 0;
        card.style.animation = `fadeIn 0.9s ease ${(i * 0.2)}s forwards`;

        card.addEventListener('mouseover', () => {
            card.querySelector('.content > .downloads').style.opacity = 1;
        });
        card.addEventListener('mouseout', () => {
            card.querySelector('.content > .downloads').style.opacity = 0;
        });
    });
